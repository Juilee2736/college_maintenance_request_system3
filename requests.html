<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Maintenance Requests
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="app-page">


<header class="app-header">

    <div class="college-brand">

        <img
            src="phcet.jpeg"
            alt="College Logo"
        >

        <div>

            <h2>
                Pillai HOC College of Engineering and Technology
            </h2>

            <p>
                College Maintenance Request System
            </p>

        </div>

    </div>


    <nav class="app-nav">

        <a href="student-dashboard.html">
            🏠 Dashboard
        </a>

        <a href="report.html">
            🔧 New Request
        </a>

        <a
            class="active"
            href="requests.html"
        >
            📋 My Requests
        </a>

        <button
            type="button"
            onclick="logout()"
        >
            Logout
        </button>

    </nav>

</header>


<main class="page-shell">


    <section class="page-heading">

        <h1>
            My Requests
        </h1>

        <p>
            Track the maintenance requests submitted by you.
        </p>

    </section>


    <section class="content-card">


        <div class="request-toolbar">

            <input
                id="requestSearch"
                type="search"
                placeholder="🔎 Search request, issue or location..."
                oninput="renderMyRequests()"
            >


            <select
                id="requestFilter"
                onchange="renderMyRequests()"
            >

                <option value="All">
                    All Status
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

        </div>


        <div id="myRequestsList"></div>

    </section>

</main>


<footer class="simple-footer">

    College Maintenance Request System

</footer>


<script src="script.js"></script>

</body>

</html>
